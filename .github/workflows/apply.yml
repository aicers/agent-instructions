name: Apply shared instruction blocks

# Reusable workflow. A consuming repository schedules it against itself:
#
#   name: Update shared instructions
#   on:
#     schedule: [{ cron: "0 6 * * 1" }]
#     workflow_dispatch:
#
#   jobs:
#     update:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: aicers/agent-instructions/.github/workflows/apply.yml@main
#
# No inputs and no secrets. It rewrites the caller's marked blocks from
# the latest release of aicers/agent-instructions, records that release
# and the blocks in the caller's `.agent-instructions.toml`, and opens
# one pull request. A caller already on the latest release gets nothing.
#
# Which blocks the caller takes is read from `repos.json` in the release,
# not from the caller: repos.json is where it is decided which repository
# consumes which blocks, and a list restated in the caller would be a
# second source for one value — one that upstream cannot edit, so a newly
# added block could never be delivered by this job at all.
#
# The direction matters. A workflow here that pushed into twelve
# repositories would need a token with write access to all of them, which
# this repository deliberately does not hold. Inverted, each caller pushes
# only to itself, with its own default GITHUB_TOKEN. A caller also stops
# being able to lag silently: the scheduled run proposes the release
# whether or not anyone remembered.
#
# GITHUB_TOKEN is enough because nothing this job writes is under
# `.github/workflows/`. GitHub refuses a push touching that directory when
# it is authenticated as the GitHub Actions app -- "refusing to allow a
# GitHub App to create or update workflow ... without `workflows`
# permission" -- and no `permissions:` grant fixes it, since the workflow
# permission set has no `workflows` scope at all. Keeping the pin out of
# the caller's workflow file is what spares every consumer a token minted,
# scoped, registered, and renewed for that one line.
#
# The price is that the pull request arrives with no checks on it: one
# opened with GITHUB_TOKEN triggers no workflow runs, which is GitHub's
# guard against a workflow retriggering itself forever. Closing and
# reopening it runs them, attributed to whoever clicked. Worth doing on
# the first apply in a repository; after that the caller's drift check
# would only be comparing a copy this job just wrote from the release
# against that same release, and it runs on the default branch at merge
# regardless.
#
# The organization setting "Allow GitHub Actions to create and approve
# pull requests" has to be enabled, or the last step fails.
#
# No permissions block here. A called workflow can only narrow what the
# caller granted, so restating them would add a way for this file to
# conflict with a correct caller and nothing else.
#
# The runner follows the caller's visibility. A private repository of the
# organization runs its workflows on the self-hosted machines, because
# GitHub bills hosted minutes for private repositories; a public one cannot
# use those machines at all and is free on hosted ones. The caller passes
# nothing for it -- every consumer's `update-instructions.yml` stays as it
# is -- because `github.event.repository` is the caller's under both
# `schedule` and `workflow_dispatch`, and says which it is.
#
# So the steps below use nothing but git, python3, curl and tar, which is
# what the self-hosted machines are known to carry, and the actions they
# call. No `gh`: the GitHub API calls are `scripts/apply_github.py`, with
# the caller's GITHUB_TOKEN taken from the environment and never put on a
# command line, where another process on a shared machine could read it.
#
# The title. A repository whose default branch holds `release-plz.toml`,
# `release-please-config.json` or `.manual-release` at its root has moved
# to Conventional Commits titles, which its checks hold every title on
# that branch to; its pull request, and the commit on it, are titled
# `chore: update shared instruction blocks to <tag>`. Any other keeps
# `Update shared instruction blocks to <tag>`. `scripts/apply_title.py`
# decides, for `scripts/sync.sh` as well, so the two cannot disagree.

on:
  workflow_call:

jobs:
  apply:
    # `fromJSON` for the label list, since an expression has no array
    # literal. A missing `private` -- an event payload without the
    # repository -- reads as public, which runs and only costs minutes.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4

      # Two checkouts, deliberately, for the reason check-drift.yml gives:
      # the scripts are mechanism, like this workflow file, and come from
      # the same place it does. The blocks are content and come from the
      # release. Running the release's scripts instead would freeze the
      # apply at whatever shipped alongside those blocks.
      - name: Check out the apply
        uses: actions/checkout@v4
        with:
          repository: aicers/agent-instructions
          ref: main
          path: .agent-instructions

      # "Latest release", not "latest tag": a tag that was never released
      # has not passed the release-surface guard, and the caller has no way
      # to tell the two apart.
      - name: Resolve the latest release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 .agent-instructions/scripts/apply_github.py \
                  latest-release)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest release is $tag"

      # The blocks and the block list both come from here. repos.json in
      # the release says what this repository should carry, so a release
      # can add a block to a repository as well as change one.
      - name: Check out the released blocks
        uses: actions/checkout@v4
        with:
          repository: aicers/agent-instructions
          ref: ${{ steps.release.outputs.tag }}
          path: .agent-instructions-blocks

      # Judged on the default branch, which is what the pull request is
      # opened against and what has merged the marker, rather than on the
      # checkout: a dispatched run may stand on any branch. Fetched into a
      # ref of its own because the step below reuses FETCH_HEAD.
      - name: Title the pull request
        id: title
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          default=$(python3 .agent-instructions/scripts/apply_github.py \
                      default-branch "$REPOSITORY")
          git fetch -q --depth=1 origin \
            "+refs/heads/$default:refs/remotes/origin/$default"
          title=$(python3 .agent-instructions/scripts/apply_title.py \
                    . "refs/remotes/origin/$default" "$TAG")
          echo "default=$default" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "titled for $default: $title"

      # Branch first, then apply on top of whatever the branch already
      # carries. Applying to the default branch instead and force-pushing
      # would rewrite the branch on every scheduled run while its pull
      # request sat unmerged: the tree would be the same, the commit would
      # not, and the caller would collect a notification a week for a pull
      # request nobody had changed.
      - name: Switch to the update branch
        id: branch
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          branch="shared-instructions/$TAG"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          # What the branch is measured against, recorded before leaving it.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # `-C` rather than `-c`: a self-hosted runner keeps its workspace,
          # and with it the branch a previous run of this release made.
          if git fetch --depth=1 origin "$branch" 2>/dev/null; then
            echo "$branch exists; updating it"
            git switch -C "$branch" FETCH_HEAD
          else
            git switch -C "$branch"
          fi

      - name: Apply the released blocks
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 .agent-instructions/scripts/apply_blocks.py \
            .agent-instructions-blocks . "$REPOSITORY" "$TAG"

      # Read back rather than resolved a second time here: what went into
      # the pull-request body is then what was written, retirements and
      # all.
      - name: Read the applied block list
        id: applied
        run: |
          set -euo pipefail
          blocks=$(python3 .agent-instructions/scripts/pin_file.py \
                     read . blocks)
          echo "blocks=$blocks" >> "$GITHUB_OUTPUT"

      # Both checkouts sit inside the caller's working tree, and the commit
      # below stages every change in it. Removing them is what keeps that
      # safe: the tree then holds nothing this job did not write. The API
      # script is kept, under `$RUNNER_TEMP`, for the last step. Python
      # rather than `rm` and `cp`, so that every tool here is one the
      # self-hosted machines are known to carry.
      - name: Remove the checkouts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil
          kept = os.path.join(os.environ["RUNNER_TEMP"], "agent-instructions-apply")
          shutil.rmtree(kept, ignore_errors=True)
          os.makedirs(kept)
          shutil.copy2(".agent-instructions/scripts/apply_github.py", kept)
          shutil.rmtree(".agent-instructions")
          shutil.rmtree(".agent-instructions-blocks")
          PY

      - name: Commit and push the branch
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.title.outputs.title }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit: this tree already matches $TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # The message is built with printf rather than as a multi-line
          # shell string, so the indentation that makes this file readable
          # does not end up inside the commit. It wraps at 72. The subject is
          # the pull request's title, whichever form that takes.
          printf '%s\n' \
            "$TITLE" \
            "" \
            "Applied from aicers/agent-instructions at $TAG, which this" \
            "repository's drift check is now pinned to. Do not edit the" \
            "marked blocks here; change them upstream and cut a release." \
            > "$RUNNER_TEMP/commit-message.txt"
          # `add -A` rather than `commit -a`, which stages changes to
          # tracked files only. The pin is an untracked path in a
          # repository being moved onto it, and a repository being
          # onboarded has never tracked it at all -- so `commit -a` would
          # push the rewritten blocks with no pin beside them, and the
          # drift check would then fail on a file it cannot read.
          git add -A
          git commit -q -F "$RUNNER_TEMP/commit-message.txt"
          git push -q origin "HEAD:refs/heads/$BRANCH"
          echo "pushed $(git rev-parse --short HEAD) to $BRANCH"

      # A separate step from the commit, because the two can get out of
      # step: a run that pushed the branch and then failed to open the
      # request -- a disabled "Allow GitHub Actions to create and approve
      # pull requests" is how that happens -- would otherwise leave every
      # later run with nothing to commit and a branch nobody is looking at.
      # So the request is checked for whenever the branch proposes
      # anything, not only when this run is the one that wrote it.
      - name: Open the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BLOCKS: ${{ steps.applied.outputs.blocks }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE: ${{ steps.branch.outputs.base }}
          DEFAULT: ${{ steps.title.outputs.default }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.title.outputs.title }}
        run: |
          set -euo pipefail

          if git diff --quiet "$BASE" HEAD; then
            echo "already on $TAG; no pull request to open"
            exit 0
          fi

          # The pull-request body is not wrapped: GitHub renders it as
          # Markdown, so hard line breaks would show up in the rendering.
          printf '%s\n' \
            "Applied from \`aicers/agent-instructions\` at \`$TAG\` by its \`apply.yml\` reusable workflow, which also moved this repository's pin in \`.agent-instructions.toml\`." \
            "" \
            "Blocks in this pull request: $BLOCKS" \
            "" \
            "This pull request has no checks on it. One opened with \`GITHUB_TOKEN\` triggers no workflow runs — close it and reopen it to run them, which is worth doing the first time this job runs here." \
            "" \
            "The marked blocks are generated. Change the wording upstream in \`aicers/agent-instructions\` rather than editing it here — the drift check in CI will fail if this repository's copy diverges." \
            > "$RUNNER_TEMP/pull-request-body.md"

          # One pull request for the branch in any state means no new one:
          # `apply_github.py` looks before it opens, and says why it did
          # not. Into the default branch, which is where `gh pr create`
          # used to open it.
          python3 "$RUNNER_TEMP/agent-instructions-apply/apply_github.py" \
            open-pull-request "$REPOSITORY" "$BRANCH" "$DEFAULT" "$TITLE" \
            "$RUNNER_TEMP/pull-request-body.md"
