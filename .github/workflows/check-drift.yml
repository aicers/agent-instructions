name: Shared instruction-block drift

# Reusable workflow. A consuming repository calls it from its own CI:
#
#   jobs:
#     instructions:
#       uses: aicers/agent-instructions/.github/workflows/check-drift.yml@main
#
# It fails when the marked blocks in the caller's AGENTS.md differ from
# the blocks in aicers/agent-instructions at the release the caller says
# it carries.
#
# Which release that is, and which blocks it has, come from the caller's
# `.agent-instructions.toml`:
#
#   ref = "0.1.0"
#   blocks = ["workflow", "rust"]
#
# Neither is an input. They would then have two sources -- that file and
# the caller's own workflow -- and the apply job can only write one of
# them, since GitHub refuses a push touching `.github/workflows/` from
# the default GITHUB_TOKEN. A caller with nothing to pass is also a
# caller nothing upstream ever has to rewrite.
#
# `ref` is a release tag rather than a branch. Comparing against a moving
# branch would turn every upstream edit into a red build in ten
# repositories at once, including pull requests that have nothing to do
# with the instructions — which trains everyone to ignore this check.
# Pinned, an upstream edit reaches a repository only through the pull
# request that moves the pin.
#
# The pin is also the record of which release a repository carries. It is
# not duplicated in a comment anywhere: it decides what the comparison
# runs against, so unlike a comment it cannot be wrong.
#
# One thing here warns rather than fails: a pin behind the latest release.
# That is a repository whose scheduled apply may have been switched off,
# which GitHub does silently after 60 days of quiet, and it is the pin
# doing its job rather than anything being wrong with the pull request in
# front of the reader.
#
# Still no inputs, and no `permissions:` block. Resolving the latest
# release and listing the caller's branches both need reads a caller's
# default token already has -- and a called workflow can only narrow what
# the caller granted, so a grant restated here could only conflict with a
# correct caller.

on:
  workflow_call:
    inputs:
      target:
        description: File in the caller repository holding the blocks
        required: false
        default: AGENTS.md
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4

      # Two checkouts, deliberately. The scripts are mechanism, like this
      # workflow file, and come from the same place it does. The blocks are
      # content and come from the pin.
      #
      # Running the pinned release's scripts instead would freeze the check's
      # implementation at whatever shipped alongside those blocks, so any new
      # step here would fail on every repository still pinned to an older
      # release -- reaching for a subcommand that release has never heard of.
      - name: Check out the check
        uses: actions/checkout@v4
        with:
          repository: aicers/agent-instructions
          ref: main
          path: .agent-instructions

      # A repository with no pin file, or one that does not say both
      # things, fails here rather than being read as carrying no blocks --
      # which would pass this check by comparing nothing, while the step
      # below called every region it has unlisted.
      - name: Read the pin
        id: pin
        run: |
          set -euo pipefail
          pin=$(python3 .agent-instructions/scripts/pin_file.py read .)
          echo "$pin"
          echo "$pin" >> "$GITHUB_OUTPUT"

      # A schedule can stop without anybody noticing. GitHub disables a
      # scheduled workflow in a repository with 60 days of no activity and
      # says nothing about it -- no failed run, no notification, nothing on
      # any pull request -- so a quiet repository stops proposing releases
      # to itself and the only symptom is the absence of pull requests
      # nobody was expecting. This runs on every pull request in every
      # consumer and already knows the pin, so it is where that becomes
      # visible.
      #
      # It warns and does not fail, and nothing below depends on it. Going
      # red because a release exists upstream would break pull requests
      # that have nothing to do with the instructions, which is what the
      # pin exists to prevent, and a check that cries wolf gets ignored.
      #
      # Before the comparison rather than after it, so a repository whose
      # blocks are also out of date still gets told which release it is
      # missing.
      #
      # `continue-on-error` because the step must not decide the job even
      # when it is the step that broke. The two things it asks of the
      # network are handled below, but a run that fails for some third
      # reason would turn a pull request red over an upstream release --
      # the exact outcome this warns instead of doing. The failure is
      # still visible in the run; it just does not travel.
      - name: Warn when the pin is behind the latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.pin.outputs.ref }}
        run: |
          set -uo pipefail
          # "Latest release", not "latest tag", for apply.yml's reason: a
          # tag that was never released has not passed the release-surface
          # guard. It is also what the apply would deliver, so this names
          # the release dispatching that job would actually bring.
          if ! latest=$(gh release view --repo aicers/agent-instructions \
                          --json tagName --jq .tagName); then
            echo "could not resolve the latest release; nothing to compare"
            exit 0
          fi
          # The branches say whether the apply ran. `--heads` with a
          # pattern prints nothing and exits 0 when none matches, which is
          # the ordinary case in a repository that is up to date. A listing
          # that could not be fetched is read as no branches: the worst it
          # does is warn a repository whose update is already waiting, and
          # a warning is not a red build.
          if ! branches=$(git ls-remote --heads origin \
                            'shared-instructions/*'); then
            branches=""
          fi
          printf '%s\n' "$branches" |
            python3 .agent-instructions/scripts/check_drift.py \
              "$PIN" "$latest"

      - name: Check out the pinned blocks
        uses: actions/checkout@v4
        with:
          repository: aicers/agent-instructions
          ref: ${{ steps.pin.outputs.ref }}
          path: .agent-instructions-blocks

      - name: Compare blocks
        env:
          BLOCKS: ${{ steps.pin.outputs.blocks }}
          TARGET: ${{ inputs.target }}
        run: |
          status=0
          # BLOCKS is a space-separated list and is meant to split.
          for block in $BLOCKS; do
            python3 .agent-instructions/scripts/render.py check \
              "$TARGET" \
              ".agent-instructions-blocks/blocks/$block.md" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::$TARGET is out of date with aicers/agent-instructions."
            echo "Do not edit the marked blocks here. Change them upstream and"
            echo "cut a release; this repository's scheduled apply.yml job then"
            echo "opens the pull request that updates this copy."
          fi
          exit "$status"

      # A block retired upstream is dropped from the pin file, and the step
      # above then stops looking at it -- leaving a stale copy of a rule
      # sitting beside its replacement with nothing to notice. Compare the
      # other direction too.
      - name: Reject blocks this repository no longer lists
        env:
          BLOCKS: ${{ steps.pin.outputs.blocks }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          listed=" $BLOCKS "
          status=0
          carried=$(python3 .agent-instructions/scripts/render.py names "$TARGET")
          for present in $carried; do
            case "$listed" in
              *" $present "*) ;;
              *)
                echo "::error::$TARGET carries shared:$present, which this"\
                     "repository no longer lists. Remove the marker pair."
                status=1
                ;;
            esac
          done
          exit "$status"
