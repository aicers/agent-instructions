name: Shared instruction-block drift

# Reusable workflow. A consuming repository calls it from its own CI:
#
#   jobs:
#     instructions:
#       uses: aicers/agent-instructions/.github/workflows/check-drift.yml@main
#
# It fails when the marked blocks in the caller's AGENTS.md differ from
# the blocks in aicers/agent-instructions at the release the caller says
# it carries.
#
# Which release that is, and which blocks it has, come from the caller's
# `.agent-instructions.toml`:
#
#   ref = "0.1.0"
#   blocks = ["workflow", "rust"]
#
# Neither is an input. They would then have two sources -- that file and
# the caller's own workflow -- and the apply job can only write one of
# them, since GitHub refuses a push touching `.github/workflows/` from
# the default GITHUB_TOKEN. A caller with nothing to pass is also a
# caller nothing upstream ever has to rewrite.
#
# `ref` is a release tag rather than a branch. Comparing against a moving
# branch would turn every upstream edit into a red build in ten
# repositories at once, including pull requests that have nothing to do
# with the instructions — which trains everyone to ignore this check.
# Pinned, an upstream edit reaches a repository only through the pull
# request that moves the pin.
#
# The pin is also the record of which release a repository carries. It is
# not duplicated in a comment anywhere: it decides what the comparison
# runs against, so unlike a comment it cannot be wrong.

on:
  workflow_call:
    inputs:
      target:
        description: File in the caller repository holding the blocks
        required: false
        default: AGENTS.md
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4

      # Two checkouts, deliberately. The scripts are mechanism, like this
      # workflow file, and come from the same place it does. The blocks are
      # content and come from the pin.
      #
      # Running the pinned release's scripts instead would freeze the check's
      # implementation at whatever shipped alongside those blocks, so any new
      # step here would fail on every repository still pinned to an older
      # release -- reaching for a subcommand that release has never heard of.
      - name: Check out the check
        uses: actions/checkout@v4
        with:
          repository: aicers/agent-instructions
          ref: main
          path: .agent-instructions

      # A repository with no pin file, or one that does not say both
      # things, fails here rather than being read as carrying no blocks --
      # which would pass this check by comparing nothing, while the step
      # below called every region it has unlisted.
      - name: Read the pin
        id: pin
        run: |
          set -euo pipefail
          pin=$(python3 .agent-instructions/scripts/pin_file.py read .)
          echo "$pin"
          echo "$pin" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned blocks
        uses: actions/checkout@v4
        with:
          repository: aicers/agent-instructions
          ref: ${{ steps.pin.outputs.ref }}
          path: .agent-instructions-blocks

      - name: Compare blocks
        env:
          BLOCKS: ${{ steps.pin.outputs.blocks }}
          TARGET: ${{ inputs.target }}
        run: |
          status=0
          # BLOCKS is a space-separated list and is meant to split.
          for block in $BLOCKS; do
            python3 .agent-instructions/scripts/render.py check \
              "$TARGET" \
              ".agent-instructions-blocks/blocks/$block.md" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::$TARGET is out of date with aicers/agent-instructions."
            echo "Do not edit the marked blocks here. Change them upstream and"
            echo "cut a release; this repository's scheduled apply.yml job then"
            echo "opens the pull request that updates this copy."
          fi
          exit "$status"

      # A block retired upstream is dropped from the pin file, and the step
      # above then stops looking at it -- leaving a stale copy of a rule
      # sitting beside its replacement with nothing to notice. Compare the
      # other direction too.
      - name: Reject blocks this repository no longer lists
        env:
          BLOCKS: ${{ steps.pin.outputs.blocks }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          listed=" $BLOCKS "
          status=0
          carried=$(python3 .agent-instructions/scripts/render.py names "$TARGET")
          for present in $carried; do
            case "$listed" in
              *" $present "*) ;;
              *)
                echo "::error::$TARGET carries shared:$present, which this"\
                     "repository no longer lists. Remove the marker pair."
                status=1
                ;;
            esac
          done
          exit "$status"
